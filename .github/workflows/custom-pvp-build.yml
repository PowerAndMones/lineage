name: Custom PvP build

on:
  push:
    branches:
      - feature/custom-pvp-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - name: Verify Java and Ant
        run: |
          java -version
          ant -version

      - name: Check whitespace errors
        run: git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD

      - name: Compile L2J Mobius core
        run: ant -f build.xml compile

      - name: Validate custom PvP XML and SQL files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("dist/game")
          npc_file = root / "data/stats/npcs/custom/custom.xml"
          npc_tree = ET.parse(npc_file)
          npc_ids = [node.attrib["id"] for node in npc_tree.getroot().findall("npc")]
          for npc_id in ("70013", "70014", "70015"):
              assert npc_ids.count(npc_id) == 1, f"Expected exactly one custom NPC {npc_id}"

          expected_templates = {
              "Arena1v1.xml": "3050",
              "Arena3v3.xml": "3051",
              "LastHero.xml": "3052",
          }
          for filename, template_id in expected_templates.items():
              tree = ET.parse(root / "data/instances/custom" / filename)
              assert tree.getroot().attrib.get("id") == template_id, f"Unexpected template ID in {filename}"
              assert tree.getroot().find("exitPoint") is not None, f"Missing exitPoint in {filename}"

          sql_dir = Path("dist/db_installer/sql/game")
          for filename in (
              "character_pvp_stats.sql",
              "character_arena1v1_stats.sql",
              "character_arena1v1_return.sql",
              "character_arena3v3_stats.sql",
              "character_lasthero_stats.sql",
          ):
              assert (sql_dir / filename).is_file(), f"Missing SQL installer: {filename}"
          print("Custom PvP XML and SQL file checks passed.")
          PY

      - name: Compile custom PvP scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/custom-pvp-classes"
          javac --release 27 -encoding UTF-8 \
            -cp "../build/bin:dist/game/libs/*" \
            -sourcepath "dist/game/data/scripts" \
            -d "$RUNNER_TEMP/custom-pvp-classes" \
            dist/game/data/scripts/custom/events/Arena1v1/Arena1v1.java \
            dist/game/data/scripts/custom/events/Arena3v3/Arena3v3.java \
            dist/game/data/scripts/custom/events/LastHero/LastHero.java \
            dist/game/data/scripts/custom/events/TeamVsTeam/TvT.java \
            dist/game/data/scripts/custom/events/CaptureTheFlag/CtF.java \
            dist/game/data/scripts/handlers/bypass/communityboard/HomeBoard.java

  sql-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: game
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Apply custom PvP SQL installers to a clean database
        env:
          MYSQL_PWD: root
        run: |
          for file in \
            dist/db_installer/sql/game/character_pvp_stats.sql \
            dist/db_installer/sql/game/character_arena1v1_stats.sql \
            dist/db_installer/sql/game/character_arena1v1_return.sql \
            dist/db_installer/sql/game/character_arena3v3_stats.sql \
            dist/db_installer/sql/game/character_lasthero_stats.sql
          do
            mariadb --protocol=tcp -h 127.0.0.1 -uroot game < "$file"
          done

      - name: Verify expected tables, columns, and leaderboard index
        env:
          MYSQL_PWD: root
        run: |
          tables=$(mariadb --protocol=tcp -h 127.0.0.1 -uroot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='game' AND table_name IN ('character_pvp_stats','character_arena1v1_stats','character_arena1v1_pair_cooldown','character_arena1v1_return','character_arena3v3_stats','character_arena3v3_team_cooldown','character_arena3v3_return','character_lasthero_stats','character_lasthero_roster_cooldown','character_lasthero_return')")
          test "$tables" = "10"
          points=$(mariadb --protocol=tcp -h 127.0.0.1 -uroot -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='game' AND table_name='character_pvp_stats' AND column_name='pvpPoints'")
          test "$points" = "1"
          idx=$(mariadb --protocol=tcp -h 127.0.0.1 -uroot -Nse "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='game' AND table_name='character_pvp_stats' AND index_name='idx_pvp_stats_points'")
          test "$idx" = "1"
          echo "SQL smoke test passed: 10 tables, pvpPoints column, and leaderboard index."
