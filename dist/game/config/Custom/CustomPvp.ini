# ---------------------------------------------------------------------------
# Custom PvP statistics and anti-farm
# ---------------------------------------------------------------------------

# Seconds before the same killer can earn custom PvP points again from the same victim.
# 30 is recommended for mass PvP. Set to 0 to disable the repeat-kill cooldown.
RepeatKillCooldownSeconds = 30

# Log a warning once the asynchronous SQL persistence queue reaches this size.
# The warning is logged again only after the queue drops below the threshold.
# Set to 0 to disable backlog warnings.
QueueWarningThreshold = 1000

# Maximum number of pending PvP records held in memory.
# If the queue reaches this limit, new custom PvP records are dropped to protect server memory.
# Set to 0 to disable the queue limit (not recommended for production).
MaxPendingRecords = 10000

# Number of SQL persistence attempts per PvP record (1-10).
# Retries use a short exponential delay; records still failing after all attempts are logged and dropped.
DatabaseRetryAttempts = 3
