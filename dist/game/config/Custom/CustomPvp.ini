# ---------------------------------------------------------------------------
# Custom PvP statistics and anti-farm
# ---------------------------------------------------------------------------

# Custom PvP points granted for each eligible open-world kill. Set to 0 to disable point income without disabling kill statistics.
PointsPerKill = 1

# Minimum victim level required for custom kill credit and points.
MinimumRewardLevel = 1

# Maximum allowed absolute killer/victim level difference for custom kill credit and points.
# Set to 0 to disable this check.
MaxRewardLevelDifference = 0

# Adena paid to each winning TvT participant. Set to 0 to disable the reward.
TvTRewardAdena = 100000

# Adena paid to each winning Capture the Flag participant. Set to 0 to disable the reward.
CtFRewardAdena = 100000

# Seconds before the same killer can earn custom PvP points again from the same victim.
# 30 is recommended for mass PvP. Set to 0 to disable the repeat-kill cooldown.
RepeatKillCooldownSeconds = 30

# Log a warning once the asynchronous SQL persistence queue reaches this size.
# The warning is logged again only after the queue drops below the threshold.
# Set to 0 to disable backlog warnings.
QueueWarningThreshold = 1000

# Maximum number of pending PvP records held in memory.
# If the queue reaches this limit, new custom PvP records are dropped to protect server memory.
# Set to 0 to disable the queue limit (not recommended for production).
MaxPendingRecords = 10000

# Number of SQL persistence attempts per PvP record (1-10).
# Retries use a short exponential delay; records still failing after all attempts are logged and dropped.
DatabaseRetryAttempts = 3

# Allow kills during registered PvP events to award global custom kills and PvP points.
# Disabled by default to prevent event farming of the global leaderboard.
RewardEventKills = False

# Allow kills inside instances to award global custom kills and PvP points.
# Disabled by default; normal open-world PvP outside instances remains eligible.
RewardInstanceKills = False
